name: CI

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

env:
    PNPM_VERSION: '11.10.0'

jobs:
    # Installs once and caches node_modules (+ the pnpm store, via setup-node's
    # built-in pnpm cache) so lint/type-check/test/build restore instead of
    # reinstalling. Those 4 jobs only depend on this one, so they still run
    # in parallel against each other.
    install:
        name: Install
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: ${{ env.PNPM_VERSION }}
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - id: cache-node-modules
              uses: actions/cache@v6
              with:
                  key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
                  path: node_modules
            - if: steps.cache-node-modules.outputs.cache-hit != 'true'
              run: pnpm install --frozen-lockfile

    lint:
        name: Lint
        needs: install
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: ${{ env.PNPM_VERSION }}
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - id: restore-node-modules
              uses: actions/cache/restore@v6
              with:
                  key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
                  path: node_modules
            - if: steps.restore-node-modules.outputs.cache-hit != 'true'
              run: pnpm install --frozen-lockfile
            - run: pnpm lint
            - run: pnpm lint:style

    type-check:
        name: Type-check
        needs: install
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: ${{ env.PNPM_VERSION }}
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - id: restore-node-modules
              uses: actions/cache/restore@v6
              with:
                  key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
                  path: node_modules
            - if: steps.restore-node-modules.outputs.cache-hit != 'true'
              run: pnpm install --frozen-lockfile
            - run: pnpm type-check

    test:
        name: Test
        needs: install
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: ${{ env.PNPM_VERSION }}
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - id: restore-node-modules
              uses: actions/cache/restore@v6
              with:
                  key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
                  path: node_modules
            - if: steps.restore-node-modules.outputs.cache-hit != 'true'
              run: pnpm install --frozen-lockfile
            - run: pnpm exec vitest run --passWithNoTests

    build:
        name: Build
        needs: install
        runs-on: ubuntu-latest
        env:
            NEXT_PUBLIC_BASE_URL: http://localhost:3000
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: ${{ env.PNPM_VERSION }}
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - id: restore-node-modules
              uses: actions/cache/restore@v6
              with:
                  key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
                  path: node_modules
            - if: steps.restore-node-modules.outputs.cache-hit != 'true'
              run: pnpm install --frozen-lockfile
            # Reuses Next.js's own incremental compiler cache across runs so an
            # unchanged commit (or a small diff) only rebuilds what changed,
            # instead of a full cold build every time.
            - uses: actions/cache@v6
              with:
                  key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
                  path: .next/cache
                  restore-keys: |
                      nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            - run: pnpm build
